# Picom sem GPU (VM sem 3D): xrender + desfoque gaussiano no processador. Com GPU, o .xinitrc usa picom.conf.
# O fundo do st já é translúcido (alpha 0.83 no config do st); o picom só desfoca o que fica atrás.

backend = "xrender";
vsync = true;   # sem vsync, a saída de um terminal faz o outro piscar
use-damage = true;
log-level = "warn";

shadow = false;
fading = false;
corner-radius = 0;
inactive-opacity = 1;
active-opacity = 1;
frame-opacity = 1;
inactive-opacity-override = false;

blur-method = "gaussian";
blur-size = 12;
blur-deviation = 6;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
# Desfoca só janelas do st; todo o resto (barra, dmenu, notificações, apps) fica intacto.
blur-background-exclude = [ "class_g != 'St'" ];

detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
