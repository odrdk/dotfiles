# picom 13. Conferir no Arch com: picom --log-level=warn
backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = true;
log-level = "warn";

shadow = false;
fading = false;
corner-radius = 0;

inactive-opacity = 0.95;
frame-opacity = 0.9;

blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;

rules: (
  { match = "window_type = 'dock' || window_type = 'desktop' || _GTK_FRAME_EXTENTS@ || class_g = 'slop'"; blur-background = false; },
  { match = "window_type = 'tooltip'"; opacity = 0.75; },
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'"; opacity = 0.8; },
);
